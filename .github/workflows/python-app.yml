name: AI Attendance System CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_system

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check Python files
        run: |
          python -m compileall .


      - name: Install testing tools
        run: |
          pip install pytest


      - name: Run Tests
        env:
          DB_HOST: localhost
          DB_NAME: attendance_system
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          PYTHONPATH: .

        run: |
          pytest